[package]
name = "hazarc"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/wyfo/hazarc"
readme = "README.md"
keywords = ["atomic", "arc", "cache", "no_std"]
categories = ["concurrency", "data-structures", "memory-management", "caching", "no-std"]
description = "A wait-free AtomicArc optimized for read-intensive use cases."
rust-version = "1.65"

[features]
default = ["default-domain"]
default-domain = []
domain-gc = []
membarrier = ["dep:libc", "dep:mach2", "dep:windows-sys"]
portable-atomic = ["dep:portable-atomic"]
portable-atomic-util = ["dep:portable-atomic-util"]
pthread-domain = ["dep:libc"]
serde = ["dep:serde"]
triomphe = ["dep:triomphe"]

[dependencies]
crossbeam-utils = { version = "0.8", default-features = false }
portable-atomic = { version = "1.3", optional = true, default-features = false, features = ["require-cas"] }
portable-atomic-util = { version = "0.2", optional = true, features = ["alloc"] }
serde = { version = "1", optional = true }
triomphe = { version = "0.1", optional = true, default-features = false }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[target.'cfg(target_vendor = "apple")'.dependencies]
mach2 = { version = "0.6", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading"], optional = true }

[target.'cfg(loom)'.dependencies]
loom = "0.7.2"
const_fn = "0.4.12"

[dev-dependencies]
arc-swap = "1.8.0"
divan = "0.1.21"
rstest = "0.27.0"

[lib]
bench = false

[[bench]]
name = "comparison"
harness = false
required-features = ["default-domain"]

[lints.rust]
missing_debug_implementations = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(hazarc_assume_membarrier)', 'cfg(hazarc_test_generation_wrap)', 'cfg(loom)'] }
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "warn"
incompatible_msrv = "allow"
semicolon_if_nothing_returned = "forbid"

[package.metadata.docs.rs]
all-features = true
