name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features: [--no-default-features, --all-features]
    steps:
      - uses: actions/checkout@v6
      - name: update toolchain
        run: rustup update stable && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.features }}
      - name: rustfmt
        run: cargo fmt -- --check --config "unstable_features=true,imports_granularity=Crate,group_imports=StdExternalCrate,format_code_in_doc_comments=true"
      - name: clippy hazarc_test_generation_wrap
        run: cargo clippy ${{ matrix.features }} --all-targets -- -D warnings
        env:
          RUSTFLAGS: --cfg=hazarc_test_generation_wrap
      - name: clippy
        run: cargo clippy ${{ matrix.features }} --all-targets -- -D warnings
      - name: test
        run: cargo test ${{ matrix.features }}
      #      - name: Install cargo-llvm-cov
      #        uses: taiki-e/install-action@cargo-llvm-cov
      #      - name: code coverage
      #        run: cargo +nightly llvm-cov ${{ matrix.features }} --fail-under-functions 90 --fail-under-lines 90 --fail-under-regions 90
      - name: check doc
        run: cargo doc
        env:
          RUSTDOCFLAGS: "-Dwarnings"

  msrv:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features: [--no-default-features, "--features pthread-domain,domain-gc,serde,portable-atomic,portable-atomic-util"]
    steps:
      - uses: actions/checkout@v6
      - name: install toolchains
        run: rustup update stable && rustup default stable && rustup toolchain install 1.65 --profile minimal
      - uses: taiki-e/install-action@cargo-hack
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv ${{ matrix.features }}
      - name: generate lockfile
        run: cargo generate-lockfile
        env:
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
      - name: check
        run: cargo hack check --rust-version --no-dev-deps --lib --profile test ${{ matrix.features }}

  thumbv6m:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features: [portable-atomic, "portable-atomic,portable-atomic-util,domain-gc"]
    steps:
      - uses: actions/checkout@v6
      - name: update toolchain
        run: rustup update stable && rustup default stable && rustup target add thumbv6m-none-eabi
      - uses: Swatinem/rust-cache@v2
        with:
          key: thumbv6m-${{ matrix.features }}
      - name: clippy
        run: cargo clippy --lib --target thumbv6m-none-eabi --no-default-features --features ${{ matrix.features }} -- -D warnings
        env:
          RUSTFLAGS: --cfg portable_atomic_unsafe_assume_single_core

  # Compilation of the platform-specific code, e.g. process-wide memory barriers
  cross-platform:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
          - aarch64-unknown-linux-gnu
          - armv7-unknown-linux-gnueabihf
          - aarch64-linux-android
          - x86_64-linux-android
          - x86_64-unknown-freebsd
          - aarch64-apple-darwin
          - aarch64-apple-ios
        rcpc: [false]
        # Process-wide memory barriers are only used on AArch64 with `rcpc`
        include:
          - target: aarch64-pc-windows-msvc
            rcpc: true
          - target: aarch64-unknown-linux-gnu
            rcpc: true
          - target: aarch64-linux-android
            rcpc: true
          - target: aarch64-apple-ios
            rcpc: true
    steps:
      - uses: actions/checkout@v6
      - name: update toolchain
        run: rustup update stable && rustup default stable && rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: cross-platform-${{ matrix.target }}-${{ matrix.rcpc }}
      - name: clippy
        run: cargo clippy --target ${{ matrix.target }} --features membarrier,domain-gc --all-targets -- -D warnings
        env:
          RUSTFLAGS: ${{ matrix.rcpc && '-C target-feature=+rcpc' || '' }}
  loom:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features: ["", --features=domain-gc]
    steps:
      - uses: actions/checkout@v6
      - name: update toolchain
        run: rustup update stable && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: loom-${{ matrix.features }}
      - name: clippy
        run: cargo clippy ${{ matrix.features }} --tests -- -D warnings
        env:
          RUSTFLAGS: "--cfg loom -C debug_assertions"
      - name: test
        run: cargo test --release --tests ${{ matrix.features }}
        env:
          RUSTFLAGS: "--cfg loom -C debug_assertions"
          LOOM_MAX_PREEMPTIONS: 2
      - name: test hazarc_test_generation_wrap
        run: cargo test --release --test hazarc ${{ matrix.features }} concurrent_reads::_domain_4_dm__0_::_policy_1_Concurrent
        env:
          RUSTFLAGS: "--cfg loom -C debug_assertions --cfg=hazarc_test_generation_wrap"
          LOOM_MAX_PREEMPTIONS: 2

  compute-miri-seeds:
    runs-on: ubuntu-latest
    outputs:
      seeds: ${{ steps.compute-seeds.outputs.seeds }}
    steps:
      - id: compute-seeds
        run: python3 -c "print('seeds=' + str([f'{i}..{i+$TOTAL//$RUNNERS}' for i in range(0,$TOTAL,$TOTAL//$RUNNERS)]))" >> $GITHUB_OUTPUT
        env:
          TOTAL: 2048
          RUNNERS: 16

  miri:
    needs: [test, compute-miri-seeds]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        # Seeds are useless without threads, so only threaded tests are run
        config:
          - name: default
            args: "-- $(python3 .github/scripts/threaded_tests.py)"
          - name: domain-gc
            args: "--features=domain-gc -- gc_concurrent_write:: drop_atomic_arc_concurrent_borrow_drop::"
          # Non-x86 code path without asymmetric barriers, i.e. the SeqCst fence of the writer's
          # scan, so `dm!` domains are skipped
          - name: aarch64
            args: >-
              --target aarch64-unknown-linux-gnu --
              concurrent_reads:: borrow_happens_before_drop:: monotonic_loads:: seq_cst_ordering::
              --skip _dm_
        seeds: ${{ fromJson(needs.compute-miri-seeds.outputs.seeds) }}
    steps:
      - uses: actions/checkout@v6
      - name: install miri
        run: rustup install nightly && rustup +nightly component add miri
      - uses: Swatinem/rust-cache@v2
        with:
          key: miri-${{ matrix.config.name }}
      - name: miri
        run: cargo +nightly miri test --test hazarc ${{ matrix.config.args }}
        env:
          MIRIFLAGS: -Zmiri-many-seeds=${{ matrix.seeds }}

  miri-no-seed:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        args: ["", --features=domain-gc, --target aarch64-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@v6
      - name: install miri
        run: rustup install nightly && rustup +nightly component add miri
      - uses: Swatinem/rust-cache@v2
        with:
          key: miri-no-seed-${{ matrix.args }}
      - name: miri
        run: cargo +nightly miri test --tests ${{ matrix.args }}

  benchmark:
    needs: test
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: update toolchain
        run: rustup update stable && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: benchmark
        run: cargo bench --all-features -- --min-time 1
